/* Layout: one full-bleed plate, fixed. The page scrolls through three figures; type sits at the edges like plate apparatus. */
:root{
  --ink:#FFF8E7;      /* Cosmic Latte */
  --line:#18171c;
  --mute:#7a7462;
  --faint:#d8ceb6;
  --glow:#2f3bd6;
  --scrim:255,248,231;
  --mag:#ff3fd2;
  --serif:"CMU Serif","Latin Modern Roman","Computer Modern Serif",Georgia,"Times New Roman",serif;
  --mono:"CMU Typewriter","Latin Modern Mono","Computer Modern Typewriter",ui-monospace,Menlo,Consolas,monospace;
  --s-1:11px; --s0:13px; --s1:16px; --s2:21px;
  color-scheme:light;
}
:root[data-mode="dark"]{--ink:#2D2C2C;--line:#eceee8;--mute:#8c9198;--faint:#30343b;--glow:#3ee8ff;--scrim:45,44,44;color-scheme:dark}
html,body{background:var(--ink);color:var(--line)}
body{font-family:var(--serif);font-size:var(--s1);line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;z-index:0;touch-action:pan-y}
.track{height:640vh;position:relative;z-index:0}
.apparatus{position:fixed;z-index:2;pointer-events:none}
.apparatus button{pointer-events:auto}
.mono{font-family:var(--mono);font-size:var(--s-1);letter-spacing:.04em;color:var(--mute);font-variant-numeric:tabular-nums}


.caption{left:max(24px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:min(36ch,calc(100vw - 48px));display:grid;gap:8px}
.caption .fig{display:flex;gap:12px;align-items:baseline}
.caption .fig b{font-family:var(--mono);font-weight:400;font-size:var(--s-1);letter-spacing:.06em;color:var(--line)}
.caption p{margin:0;font-size:var(--s1);line-height:1.45;color:var(--line);text-wrap:pretty;min-height:4.35em}
.caption p em{color:var(--mute)}
.readout{min-height:1.4em}
.caption::before,.ctl::before{content:"";position:absolute;inset:-60px -80px -40px -60px;z-index:-1;background:radial-gradient(closest-side,rgba(var(--scrim),.88),rgba(var(--scrim),.6) 60%,rgba(var(--scrim),0));pointer-events:none}
.ctl::before{inset:-50px -60px -40px -80px}
.rail::before{content:"";position:absolute;inset:-50px -70px -50px -90px;z-index:-1;background:radial-gradient(closest-side,rgba(var(--scrim),.9),rgba(var(--scrim),.6) 60%,rgba(var(--scrim),0));pointer-events:none}

.rail{right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));top:50%;transform:translateY(-50%);display:grid;gap:18px;justify-items:end}
.rail button{all:unset;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:var(--s-1);letter-spacing:.06em;color:var(--mute);padding:4px 0}
.rail button::after{content:"";width:18px;height:1px;background:var(--faint);transition:width .4s,background .4s}
.rail button[aria-current="true"]{color:var(--line)}
.rail button[aria-current="true"]::after{width:42px;background:var(--line)}
.rail button:focus-visible,.ctl button:focus-visible{outline:1px solid var(--glow);outline-offset:4px}

.ctl{right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:10px;justify-items:end}
.ctl .row{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ctl button{all:unset;pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:var(--s-1);letter-spacing:.05em;color:var(--mute);padding:6px 9px;border:1px solid var(--faint)}
.ctl button[aria-pressed="true"]{color:var(--ink);background:var(--line);border-color:var(--line)}
.ctl button:hover{color:var(--line)}
.ctl button[aria-pressed="true"]:hover{color:var(--ink)}
.hint{transition:opacity .6s}

[hidden]{display:none!important}
.peak{position:fixed;left:0;top:0;z-index:1;pointer-events:none;opacity:0;white-space:normal;width:min(190px,42vw);text-align:center;display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-size:15px;line-height:1.2;color:var(--line)}
.peak small{font-family:var(--mono);font-size:var(--s-1);letter-spacing:.04em;color:var(--mute);margin-top:3px}
.peak::before{content:"";width:1px;height:18px;margin-bottom:8px;background:var(--line);opacity:.35}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ------------------------------------------------------------------ *
 *  0. Setup
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('fallback').hidden = false;
  throw e;
}
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0xFFF8E7, 1);
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 0, 5.6);

// seeded random, so every load draws the same flower
let _s = 1337;
const rnd = () => { _s = (_s * 16807) % 2147483647; return (_s - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();

/* ------------------------------------------------------------------ *
 *  1. The flower — two heads on one forked stem, as a wire mesh
 * ------------------------------------------------------------------ */
const buds = [];
const petalForVertex = [];
const petalWidth = [];
const petals = [];
const P = [];          // positions
const G = [];          // grow order 0..1
const U = [];          // position along petal / stem 0..1
const SD = [];         // per-vertex seed
const PT = [];          // per-petal phase (for the travelling pulse)
const PA = [];          // part: 0 stem, 1 pointed head, 2 rounded head
let curPart = 0;
const E = [];          // edges (pairs of vertex indices)
let nV = 0;
function addV(p, g, u, pt) { P.push(p[0], p[1], p[2]); buds.push(...p); petalForVertex.push(null); petalWidth.push(0); G.push(g); U.push(u); SD.push(rnd()); PT.push(pt); PA.push(curPart); return nV++; }

const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
function frameFor(axis) {
  const a = axis.clone().normalize();
  const ref = Math.abs(a.y) < 0.9 ? v3(0, 1, 0) : v3(1, 0, 0);
  const e1 = new THREE.Vector3().crossVectors(a, ref).normalize();
  const e2 = new THREE.Vector3().crossVectors(a, e1).normalize();
  return { a, e1, e2 };
}

// a petal as a u×v grid of points, joined along, across and (sometimes) diagonally
function petal(o) {
  const { c, F, phi, base, L, W, a0, curl, cup, nu, nv, widthFn, g0, g1, twist, diag, tear } = o;
  const rh = F.e1.clone().multiplyScalar(Math.cos(phi)).add(F.e2.clone().multiplyScalar(Math.sin(phi)));
  const th = new THREE.Vector3().crossVectors(F.a, rh).normalize();
  const pt = rnd();
  const motion = {root:c.clone().add(rh.clone().multiplyScalar(base)), axis:th.clone(), radial:rh.clone(), seed:pt};
  petals.push(motion);
  // centreline by integrating the bending angle along the length
  const cl = []; const ang = [];
  let p = c.clone().add(rh.clone().multiplyScalar(base));
  for (let i = 0; i < nu; i++) {
    const u = i / (nu - 1);
    const al = a0 + curl * u * u;
    cl.push(p.clone()); ang.push(al);
    const step = rh.clone().multiplyScalar(Math.cos(al)).add(F.a.clone().multiplyScalar(Math.sin(al))).multiplyScalar(L / (nu - 1));
    p.add(step);
  }
  const idx = [];
  for (let i = 0; i < nu; i++) {
    const u = i / (nu - 1);
    const w = widthFn(u) * W;
    // normal to the petal surface, roughly: perpendicular to direction of travel and to the width axis
    const dir = rh.clone().multiplyScalar(Math.cos(ang[i])).add(F.a.clone().multiplyScalar(Math.sin(ang[i])));
    const nrm = new THREE.Vector3().crossVectors(th, dir).normalize();
    const tw = twist * u;
    for (let j = 0; j < nv; j++) {
      const v = (j / (nv - 1)) * 2 - 1;
      const q = cl[i].clone()
        .add(th.clone().multiplyScalar(v * w * Math.cos(tw)))
        .add(nrm.clone().multiplyScalar(v * w * Math.sin(tw) + v * v * w * cup));
      const vi=addV([q.x,q.y,q.z],g0+(g1-g0)*u,u,pt);idx.push(vi);
      petalForVertex[vi]=motion; petalWidth[vi]=v;
      const bud=c.clone().add(rh.clone().multiplyScalar(base+Math.sin(u*Math.PI)*L*.12))
        .add(F.a.clone().multiplyScalar(u*L*.94))
        .add(th.clone().multiplyScalar(v*w*.17));
      buds[3*vi]=bud.x;buds[3*vi+1]=bud.y;buds[3*vi+2]=bud.z;
    }
  }
  const id = (i, j) => idx[i * nv + j];
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const u = i / (nu - 1);
    if (u > 0.82 && rnd() < tear) continue;                     // torn at the tip
    if (j < nv - 1) E.push(id(i, j), id(i, j + 1));
    if (i < nu - 1) E.push(id(i, j), id(i + 1, j));
    if (i < nu - 1 && j < nv - 1 && rnd() < diag) {
      if ((i + j) % 2) E.push(id(i, j), id(i + 1, j + 1)); else E.push(id(i, j + 1), id(i + 1, j));
    }
  }
}

function ring(c, F, r, n, lift, g, ellip = 1, tilt = 0) {
  const first = nV; let prev = -1;
  for (let k = 0; k < n; k++) {
    const t = (k / n) * Math.PI * 2;
    const q = c.clone()
      .add(F.e1.clone().multiplyScalar(Math.cos(t) * r))
      .add(F.e2.clone().multiplyScalar(Math.sin(t) * r * ellip))
      .add(F.a.clone().multiplyScalar(lift + Math.sin(t) * tilt));
    const i = addV([q.x, q.y, q.z], g, 0.5, rnd());
    if (prev >= 0) E.push(prev, i);
    prev = i;
  }
  E.push(prev, first);
}

function disc(c, F, R, g) {
  // seed head: concentric rings + spokes, slightly domed
  const rings = 5, spokes = 34;
  const id = [];
  const ctr = addV([c.x, c.y, c.z], g, 0, 0);
  for (let i = 1; i <= rings; i++) {
    const r = (i / rings) * R;
    for (let k = 0; k < spokes; k++) {
      const t = (k / spokes) * Math.PI * 2 + i * 0.09;
      const lift = 0.05 * (1 - (r / R) ** 2);
      const q = c.clone().add(F.e1.clone().multiplyScalar(Math.cos(t) * r)).add(F.e2.clone().multiplyScalar(Math.sin(t) * r)).add(F.a.clone().multiplyScalar(lift));
      id.push(addV([q.x, q.y, q.z], g + 0.04 * i / rings, 0.1, rnd()));
    }
  }
  const at = (i, k) => id[(i - 1) * spokes + ((k + spokes) % spokes)];
  for (let i = 1; i <= rings; i++) for (let k = 0; k < spokes; k++) {
    E.push(at(i, k), at(i, k + 1));
    if (i < rings) E.push(at(i, k), at(i + 1, k));
    if (i === 1) E.push(ctr, at(1, k));
  }
}

function tube(curve, r0, r1, sides, segs, g0, g1) {
  const pts = curve.getSpacedPoints(segs);
  const frames = curve.computeFrenetFrames(segs, false);
  const id = [];
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const r = r0 + (r1 - r0) * u;
    for (let k = 0; k < sides; k++) {
      const t = (k / sides) * Math.PI * 2;
      const q = pts[i].clone()
        .add(frames.normals[i].clone().multiplyScalar(Math.cos(t) * r))
        .add(frames.binormals[i].clone().multiplyScalar(Math.sin(t) * r));
      id.push(addV([q.x, q.y, q.z], g0 + (g1 - g0) * u, u * 0.3, 0.37));
    }
  }
  const at = (i, k) => id[i * sides + ((k + sides) % sides)];
  for (let i = 0; i <= segs; i++) for (let k = 0; k < sides; k++) {
    E.push(at(i, k), at(i, k + 1));
    if (i < segs) { E.push(at(i, k), at(i + 1, k)); if ((i + k) % 3 === 0) E.push(at(i, k), at(i + 1, k + 1)); }
  }
}

// layout
const base = v3(0.02, -1.95, 0);
const fork = v3(-0.02, -0.95, 0.02);
const headA = v3(0.78, 0.5, 0.18);          // lotus (right)
const headB = v3(-0.82, 0.58, -0.12);        // lily (left)
const axA = v3(0.20, 0.85, 1.10);
const axB = v3(-0.18, 0.50, 1.20);
const FA = frameFor(axA), FB = frameFor(axB);

tube(new THREE.CatmullRomCurve3([base, v3(0, -1.5, 0.01), fork]), 0.03, 0.026, 7, 26, 0.0, 0.12);
tube(new THREE.CatmullRomCurve3([fork, v3(0.18, -0.55, 0.06), v3(0.45, 0.05, 0.14), headA.clone().sub(FA.a.clone().multiplyScalar(0.06))]), 0.024, 0.02, 6, 34, 0.12, 0.3);
tube(new THREE.CatmullRomCurve3([fork, v3(-0.2, -0.5, -0.02), v3(-0.45, 0.1, -0.1), headB.clone().sub(FB.a.clone().multiplyScalar(0.06))]), 0.024, 0.02, 6, 34, 0.12, 0.3);

// Right: lotus — broad pointed petals in three nested, cupped whorls.
curPart = 1;
const lotusWidth = u => .025 + Math.pow(Math.sin(Math.PI*u), .80) * (.65 + .4*u);
const ringsA = [
  {n:9, base:.09, L:.78, W:.23, a0:.04, curl:.95, g:.36},
  {n:8, base:.07, L:.64, W:.21, a0:.42, curl:.85, g:.43},
  {n:6, base:.05, L:.48, W:.17, a0:.90, curl:.48, g:.50},
];
ringsA.forEach((R,ri)=>{
  for(let k=0;k<R.n;k++) petal({
    c:headA,F:FA,phi:k/R.n*Math.PI*2+ri*.39,
    base:R.base,L:R.L*rr(.97,1.03),W:R.W,a0:R.a0,curl:R.curl,
    cup:.75,nu:25,nv:9,widthFn:lotusWidth,g0:R.g,g1:R.g+.22,
    twist:rr(-.06,.06),diag:.25,tear:0,
  });
});
disc(headA.clone().add(FA.a.clone().multiplyScalar(.17)),FA,.105,.42);

// Left: lily — six long, tapered tepals with recurved tips and visible stamens.
curPart = 2;
const lilyWidth = u => .012 + Math.pow(Math.sin(Math.PI*u),.85) * (.92-.22*u);
for(let k=0;k<6;k++){
  petal({c:headB,F:FB,phi:k/6*Math.PI*2+.18,
    base:.035,L:k%2===0?.94:.86,W:k%2===0?.235:.205,
    a0:.72,curl:-1.72,cup:.28,nu:31,nv:9,widthFn:lilyWidth,
    g0:.36,g1:.64,twist:k%2===0?.10:-.10,diag:.18,tear:0});
}
for(let k=0;k<6;k++){
  const theta=k/6*Math.PI*2;
  const radial=FB.e1.clone().multiplyScalar(Math.cos(theta)).add(FB.e2.clone().multiplyScalar(Math.sin(theta)));
  const end=headB.clone().add(FB.a.clone().multiplyScalar(.44)).add(radial.clone().multiplyScalar(.15));
  tube(new THREE.CatmullRomCurve3([headB,headB.clone().add(FB.a.clone().multiplyScalar(.25)).add(radial.clone().multiplyScalar(.06)),end]),.008,.006,5,15,.43,.64);
  // Slender, elongated anthers at the ends of the six filaments.
  const af=frameFor(radial);
  ring(end,af,.045,20,0,.64,.30);
  ring(end,af,.039,20,.008,.64,.30);
}
tube(new THREE.CatmullRomCurve3([headB,headB.clone().add(FB.a.clone().multiplyScalar(.3)),headB.clone().add(FB.a.clone().multiplyScalar(.54))]),.009,.012,6,18,.44,.65);

// centre the whole drawing on the origin
const bb = new THREE.Box3();
for (let i = 0; i < nV; i++) bb.expandByPoint(v3(P[3 * i], P[3 * i + 1], P[3 * i + 2]));
const ctr = bb.getCenter(new THREE.Vector3());
for (let i = 0; i < nV; i++) { P[3 * i] -= ctr.x; P[3 * i + 1] -= ctr.y; P[3 * i + 2] -= ctr.z; }
headA.sub(ctr); headB.sub(ctr);
for(let i=0;i<nV;i++){buds[3*i]-=ctr.x;buds[3*i+1]-=ctr.y;buds[3*i+2]-=ctr.z;}
for(const p of petals)p.root.sub(ctr);

const flower = new Float32Array(P);
const NE = E.length / 2;

/* ------------------------------------------------------------------ *
 *  2. Basins of attraction — an inverted surface with two minima.
 *     h(x, z) = 0.85·exp(−|p − L|² / 2σL²) + 1.55·exp(−|p − G|² / 2σG²)
 *     Every vertex of the flower is given a node on this surface.
 * ------------------------------------------------------------------ */
const GX = 1.65, GZ = -0.75, GH = 1.55, GS = 0.82;     // global maximum
const LX = -1.65, LZp = 0.80, LH = 0.85, LS = 0.72;   // local maximum
// Keep the entire receiving surface below the opened petals.
const petalFloor=flower.reduce((low,value,i)=>i%3===1 && petalForVertex[(i-1)/3]?Math.min(low,value):low,Infinity);
const Y0 = Math.min(-.35,petalFloor-.12), EXT = 3.65, GN = 97;
function height(x, z) {
  const dg = (x - GX) ** 2 + (z - GZ) ** 2, dl = (x - LX) ** 2 + (z - LZp) ** 2;
  return GH * Math.exp(-dg / (2 * GS * GS)) + LH * Math.exp(-dl / (2 * LS * LS));
}
const nodes = new Float32Array(GN * GN * 3), nodeDelay = new Float32Array(GN * GN), nodeH = new Float32Array(GN * GN);
for (let r = 0; r < GN; r++) for (let c = 0; c < GN; c++) {
  const n = r * GN + c;
  const x = -EXT + (2 * EXT * c) / (GN - 1), z = -EXT + (2 * EXT * r) / (GN - 1);
  const h = height(x, z);
  nodes[3 * n] = x; nodes[3 * n + 1] = Y0 - h; nodes[3 * n + 2] = z;
  nodeH[n] = h / GH;
  // the basin centres are laid down first, the rim last
  nodeDelay[n] = Math.min(0.75, 0.55 * (1 - h / GH) + 0.15 * Math.hypot(x, z) / EXT + 0.08 * rnd());
}
// give each flower vertex a node: columns by x, rows by height in the flower
const target = new Uint32Array(nV);
{
  const order = Array.from({ length: nV }, (_, i) => i).sort((a, b) => flower[3 * a] - flower[3 * b]);
  for (let c = 0; c < GN; c++) {
    const sl = order.slice(Math.floor((c * nV) / GN), Math.floor(((c + 1) * nV) / GN)).sort((a, b) => flower[3 * b + 1] - flower[3 * a + 1]);
    sl.forEach((vi, k) => { target[vi] = Math.min(GN - 1, Math.floor((k * GN) / sl.length)) * GN + c; });
  }
}
const cur = new Float32Array(nV * 3);
const disp = new Float32Array(flower);
// Each petal's existing u/v grid is assigned a contiguous surface patch.
// Edges are never swapped out: the petal mesh itself becomes the basin mesh.
const surfaceTarget=new Float32Array(nV*3);
const orderedPetals=[...petals].sort((a,b)=>a.root.x-b.root.x || a.seed-b.seed);
const columnCount=6, baseRows=Math.floor(petals.length/columnCount), extra=petals.length%columnCount;
let patchIndex=0;
for(let col=0;col<columnCount;col++){
  const rows=baseRows+(col<extra?1:0);

 futureWorld.style.pointerEvents=worldBlend>.94?'auto':'none';
 futureWorld.inert=worldBlend<.94;
 futureWorld.classList.toggle('reveal',worldBlend>.4);
 document.body.classList.toggle('world-active',worldBlend>.18);
 canvas.style.opacity='1';
 lineMat.uniforms.uGain.value*=1-sm(.04,.78,worldBlend);
 numMat.uniforms.uCoalesce.value=worldBlend;
 pathMaterial.opacity=.8*(1-sm(0,.5,worldBlend));
 pointMaterial.transparent=true;pointMaterial.opacity=1-sm(.12,.55,worldBlend);
 halo.material.opacity=.15*(1-sm(.08,.5,worldBlend));
 paintAssembly(worldBlend);
 if(worldBlend>.98 && !worldFocused){worldTitle.focus({preventScroll:true});worldFocused=true;}
 if(returnFocusToChoice && worldBlend<.05){labL.focus({preventScroll:true});returnFocusToChoice=false;}
}

let last = performance.now(), time = 0, lastT = -1, settle = 0, snap = false;
window.__figure = { jump(v) { sS = v; snap = true; } };
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  time += dt * (reduceMotion ? 0.3 : 1);

  if (auto) { autoT += dt; sT = tl(autoT); }
  else sT = 0.44 + 0.56 * Math.min(1, Math.max(0, scrollY / maxScroll()));
  sS += (sT - sS) * Math.min(1, dt * 4.5);
  const s = sS;

  const grow = sm(0.04, 0.38, s);
  const bloom = sm(0.22, 0.42, s);
  const opening=sm(.44,.65,s), shedding=sm(.65,.80,s);
  const adv = sm(.74,1,s);
  const tL = adv;

  shared.uShed.value=shedding; shared.uTime.value = time; shared.uGrow.value = grow; shared.uBloom.value = bloom; shared.uAdv.value = adv;

  // positions
  landAt(tL,opening,shedding); settle=40;
  if (settle > 0) {
    const k = snap ? 1 : 0.3; snap = false;
    let moved = 0;
    for (let i = 0; i < disp.length; i++) { const d = cur[i] - disp[i]; disp[i] += d * k; moved = Math.max(moved, Math.abs(d)); }
    fillSegments(disp); posAttr.needsUpdate = true; othAttr.needsUpdate = true;
    fillNumbers(disp); dotAttr.needsUpdate = true;
    settle = moved < 1e-4 ? settle - 1 : 40;
  }

  updateTrajectory(dt,s);

  // camera: table face-on → flower, three-quarter, drifting → attractor, front-on and wider
  const wide = camera.aspect > 1.1 ? 1 : 0;
  pmx += (mx - pmx) * dt * 2; pmy += (my - pmy) * dt * 2;
  const g2 = sm(0.08, 0.42, s), g3 = adv;
  const az = lerp(lerp(0, 0.3 + 0.22 * Math.sin(time * 0.11), g2), -0.42 + 0.14 * Math.sin(time * 0.07), g3) + pmx * 0.22 * g2;
  const el = lerp(lerp(0, 0.14, g2), 0.46, g3) - pmy * 0.12 * g2;
  const dist = lerp(lerp(5.6, wide ? 4.4 : 7.4, g2), wide ? 9.4 : 16.2, g3);
  look.set(lerp(lerp(0, wide ? -0.22 : 0, g2), 0.05, g3), lerp(lerp(0, wide ? 0.3 : 0.1, g2), Y0 - 0.55, g3), 0);
  camera.position.set(look.x + dist * Math.sin(az) * Math.cos(el), look.y + dist * Math.sin(el), dist * Math.cos(az) * Math.cos(el));
  const following=pathActive && (pathState==='spiral'||pathState==='arrived');
  // Ease in from the overview, then descend with the point into the chosen basin.
  const followTarget=following?1:0;
  followBlend+=(followTarget-followBlend)*(1-Math.exp(-dt*(reduceMotion?1.2:1.7)));
  if(following){
    const centre=pathSelection==='global'?C1:C2;
    followDestination.copy(traveller.position).lerp(centre,.22);
    followFocus.lerp(followDestination,1-Math.exp(-dt*2.8));
  }
  if(followBlend>.0001){
    if(following)followZoomProgress=Math.min(1,pathElapsed/(reduceMotion?2:7));
    const progress=followZoomProgress;
    const distance=lerp(camera.aspect>1.1?4.2:5.5,camera.aspect>1.1?2.7:3.8,sm(0,1,progress));
    const elevation=lerp(.65,.60,progress);
    followPosition.set(followFocus.x+Math.sin(followAz)*distance*Math.cos(elevation),followFocus.y+distance*Math.sin(elevation),followFocus.z+Math.cos(followAz)*distance*Math.cos(elevation));
    camera.position.lerp(followPosition,followBlend);
    look.lerp(followFocus,followBlend);
  }
  camera.lookAt(look);
  camera.updateMatrixWorld();

  // colour fields follow the heads, then settle on the attractor's two fixed points
  const pa = new THREE.Vector3().lerpVectors(headA, C1, g3), pb = new THREE.Vector3().lerpVectors(headB, C2, g3);
  toScreen(pa, lerp(0.46, 0.8, g3), blobA); toScreen(pb, lerp(0.42, 0.8, g3), blobB);
  bgMat.uniforms.uA.value.copy(blobA); bgMat.uniforms.uB.value.copy(blobB);
  bgMat.uniforms.uAmt.value = bloom * lerp(0.62, 0.75, g3) * (0.85 + 0.15 * Math.sin(time * 0.6));
  glowMat.uniforms.uAmt.value = GLOW * bloom * (1.0-g3);
  bgMat.uniforms.uAmt.value *= (1 - g3);
  lineMat.uniforms.uGain.value = 1 + .4*g3;
  dotMat.uniforms.uA.value = 0;
  gridMat.uniforms.uLand.value = 0;
  grid.visible = false;
  const la = sm(0.85, 1, g3);
  placeBasinLabels(la);

  // captions
  const fig = s < .72 ? 0 : 1;
  if (fig !== figShown) {
    figShown = fig;
    figno.textContent = FIGS[fig][0]; figname.textContent = FIGS[fig][1];
    rails.forEach((r, i) => r.setAttribute('aria-current', i === fig ? 'true' : 'false'));
  }
  readout.textContent = fig === 0 ? (shedding>0?'Petals falling · unravelling into the surface':opening<.99?'Petals unfurling':'In full bloom')
    : `The petal grids, unfolded into two basins of attraction`;

  updateFutureWorld(dt);
  if (shared.uLight.value > 0.5) renderer.render(scene, camera); else composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
